---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_9_2_5 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogFileSize:
    title: "9.2.5 | Ensure 'Windows Firewall: Private: Logging: Size limit (KB)' is set to '16,384 KB or greater' | LogFileSize"
    exists: true
    value: {{ .Vars.win11cis_private_firewall_log_size }}
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 9.2.5
  {{ end }}
{{ end }}
