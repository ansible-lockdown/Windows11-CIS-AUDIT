---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_9_1_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogFilePath:
    title: "9.1.4 | Ensure 'Windows Firewall: Domain: Logging: Name' is set to '%SystemRoot%\\System32\\logfiles\\firewall\\domainfw.log' | LogFilePath"
    exists: true
    value: '{{ .Vars.win11cis_domain_firewall_log_path }}'
    type: REG_SZ
    meta:
      workstation: 1
      CIS_ID:
        - 9.1.4
  {{ end }}
{{ end }}
