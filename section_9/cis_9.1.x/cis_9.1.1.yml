---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_9_1_1 }}
    {{ if .Vars.win11cis_domain_joined }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\EnableFirewall:
    title: "9.1.1 | Ensure 'Windows Firewall: Domain: Firewall state' is set to 'On (recommended)' | EnableFirewall"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 9.1.1
file:
  win11cis_9_1_1_effective:
    title: "9.1.1 | Ensure 'Windows Firewall: Domain: Firewall state' is set to 'On (recommended)' | effective"
    path: '{{ .Vars.win11cis_snapshot_dir }}\Firewall.Domain.Enabled'
    exists: true
    contents:
      - '/^True$/'
    meta:
      workstation: 1
      CIS_ID:
        - 9.1.1
    {{ end }}
  {{ end }}
{{ end }}
