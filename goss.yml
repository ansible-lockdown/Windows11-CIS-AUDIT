# Canaries. A missing or half-written snapshot must read as a loud failure, not
# as a clean pass on having examined nothing.
file:
  win11cis_snapshot_present:
    title: "Policy snapshot is present and complete"
    path: '{{ .Vars.win11cis_snapshot_dir }}\Snapshot.Areas'
    exists: true
    contents:
      - '/^SECURITYPOLICY,USER_RIGHTS,AUDITPOL,SERVICES,FIREWALL,HKU$/'
  win11cis_snapshot_parsed:
    title: "Policy snapshot parsed the secedit export"
    path: '{{ .Vars.win11cis_snapshot_dir }}\SystemAccess.PasswordHistorySize'
    exists: true
    contents:
      - '/^[0-9]+$/'

# Metadata
command:
  benchmark_meta:
    title: Benchmark MetaData
    exec: cmd /c echo BenchMark MetaData
    exit-status: 0
    meta:
      host_machine_uuid: {{ .Vars.machine_uuid }}
      host_epoch: {{ .Vars.epoch }}
      host_os_locale: {{ .Vars.os_locale }}
      host_os_release: {{ .Vars.os_release }}
      host_os_build: {{ .Vars.os_build }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_automation_group: {{ .Vars.auto_group }}
      host_hostname: {{ .Vars.os_hostname }}
      host_system_type: {{ .Vars.system_type }}
      benchmark_type: {{ .Vars.benchmark_type }}
      benchmark_version: {{ .Vars.benchmark_version }}
      benchmark_os: {{ .Vars.benchmark_os }}
