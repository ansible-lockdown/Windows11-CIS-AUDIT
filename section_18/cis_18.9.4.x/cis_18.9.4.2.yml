---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_9_4_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation\AllowProtectedCreds:
    title: "18.9.4.2 | Ensure 'Remote host allows delegation of non- exportable credentials' is set to 'Enabled' | AllowProtectedCreds"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.9.4.2
  {{ end }}
{{ end }}
