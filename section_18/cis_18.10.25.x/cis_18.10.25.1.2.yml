---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_10_25_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Application\MaxSize:
    title: "18.10.25.1.2 | Ensure 'Application: Specify the maximum log file size (KB)' is set to 'Enabled: 32,768 or greater' | MaxSize"
    exists: true
    value: {{ .Vars.win11cis_application_max_log_file_size }}
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.25.1.2
  {{ end }}
{{ end }}
