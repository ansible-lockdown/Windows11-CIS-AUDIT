---

{{ if .Vars.win11cis_level_2 }}
  {{ if .Vars.win11cis_rule_18_5_6 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\KeepAliveTime:
    title: "18.5.6 | Ensure 'MSS: (KeepAliveTime) How often keep-alive packets are sent in milliseconds' is set to 'Enabled: 300,000 or 5 minutes' | KeepAliveTime"
    exists: true
    value: 300000
    type: REG_DWORD
    meta:
      workstation: 2
      CIS_ID:
        - 18.5.6
  {{ end }}
{{ end }}
