---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_10_13_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Connect\RequirePinForPairing:
    title: "18.10.13.1 | Ensure 'Require pin for pairing' is set to 'Enabled: First Time' OR 'Enabled: Always' | RequirePinForPairing"
    exists: true
    value: {{ .Vars.win11cis_require_pin_for_pairing }}
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.13.1
  {{ end }}
{{ end }}
