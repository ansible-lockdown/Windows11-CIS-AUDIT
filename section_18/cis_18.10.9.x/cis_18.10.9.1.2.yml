---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\FDVRecovery:
    title: "18.10.9.1.2 | (BL) Ensure 'Choose how BitLocker-protected fixed drives can be recovered' is set to 'Enabled' | FDVRecovery"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.1.2
  {{ end }}
{{ end }}
