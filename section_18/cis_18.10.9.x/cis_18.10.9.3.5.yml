---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_3_5 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVRecoveryKey:
    title: "18.10.9.3.5 | (BL) Ensure 'Choose how BitLocker-protected removable drives can be recovered: Recovery Key' is set to 'Enabled: Do not allow 256-bit recovery key' | RDVRecoveryKey"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.3.5
  {{ end }}
{{ end }}
