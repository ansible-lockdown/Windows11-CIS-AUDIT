---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_7 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSHideRecoveryPage:
    title: "18.10.9.2.7 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Omit recovery options from the BitLocker setup wizard' is set to 'Enabled: True' | OSHideRecoveryPage"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.7
  {{ end }}
{{ end }}
