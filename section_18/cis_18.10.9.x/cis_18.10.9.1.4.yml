---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_1_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\FDVRecoveryPassword:
    title: "18.10.9.1.4 | (BL) Ensure 'Choose how BitLocker-protected fixed drives can be recovered: Recovery Password' is set to 'Enabled: Allow 48-digit recovery password' or higher | FDVRecoveryPassword"
    exists: true
    value: {{ .Vars.win11cis_48_digit_recovery_password_setting }}
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.1.4
  {{ end }}
{{ end }}
