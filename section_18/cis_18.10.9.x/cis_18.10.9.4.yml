---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\DisableExternalDMAUnderLock:
    title: "18.10.9.4 | (BL) Ensure 'Disable new DMA devices when this computer is locked' is set to 'Enabled' | DisableExternalDMAUnderLock"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.4
  {{ end }}
{{ end }}
