---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_3_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVDiscoveryVolumeType:
    title: "18.10.9.3.1 | (BL) Ensure 'Allow access to BitLocker-protected removable data drives from earlier versions of Windows' is set to 'Disabled' | RDVDiscoveryVolumeType"
    exists: true
    value: ""
    type: REG_SZ
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.3.1
  {{ end }}
{{ end }}
