---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_9 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSActiveDirectoryInfoToStore:
    title: "18.10.9.2.9 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Configure storage of BitLocker recovery information to AD DS:' is set to 'Enabled: Store recovery passwords and key packages' | OSActiveDirectoryInfoToStore"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.9
  {{ end }}
{{ end }}
