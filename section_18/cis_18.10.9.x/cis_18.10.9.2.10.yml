---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_10 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSRequireActiveDirectoryBackup:
    title: "18.10.9.2.10 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Do not enable BitLocker until recovery information is stored to AD DS for operating system drives' is set to 'Enabled: True' | OSRequireActiveDirectoryBackup"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.10
  {{ end }}
{{ end }}
