---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSManageDRA:
    title: "18.10.9.2.4 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Allow data recovery agent' is set to 'Enabled: False' | OSManageDRA"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.4
  {{ end }}
{{ end }}
