{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_6 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSRecoveryKey:
    title: "18.10.9.2.6 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Recovery Key' is set to 'Enabled: Do not allow 256-bit recovery key' | OSRecoveryKey"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.6
  {{ end }}
{{ end }}
