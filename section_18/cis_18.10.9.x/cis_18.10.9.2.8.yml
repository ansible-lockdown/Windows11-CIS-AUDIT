---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_8 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSActiveDirectoryBackup:
    title: "18.10.9.2.8 | (BL) Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Save BitLocker recovery information to AD DS for operating system drives' is set to 'Enabled: True' | OSActiveDirectoryBackup"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.8
  {{ end }}
{{ end }}
