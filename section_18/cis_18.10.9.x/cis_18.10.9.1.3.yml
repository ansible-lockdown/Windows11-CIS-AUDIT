---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_1_3 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\FDVManageDRA:
    title: "18.10.9.1.3 | (BL) Ensure 'Choose how BitLocker-protected fixed drives can be recovered: Allow data recovery agent' is set to 'Enabled: True' | FDVManageDRA"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.1.3
  {{ end }}
{{ end }}
