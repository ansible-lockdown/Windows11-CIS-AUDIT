---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_2_17 }}
    {{ if not .Vars.win11cis_domain_joined }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\UseTPMKey:
    title: "18.10.9.2.17 | (BL) Ensure 'Require additional authentication at startup: Configure TPM startup key:' is set to 'Enabled: Do not allow startup key with TPM' | UseTPMKey"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.2.17
    {{ end }}
  {{ end }}
{{ end }}
