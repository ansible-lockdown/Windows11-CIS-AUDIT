---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_9_1_6 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\FDVHideRecoveryPage:
    title: "18.10.9.1.6 | (BL) Ensure 'Choose how BitLocker-protected fixed drives can be recovered: Omit recovery options from the BitLocker setup wizard' is set to 'Enabled: True' | FDVHideRecoveryPage"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.9.1.6
  {{ end }}
{{ end }}
