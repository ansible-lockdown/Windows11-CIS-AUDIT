---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_10_75_2_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnableSmartScreen:
    title: "18.10.75.2.1 | Ensure 'Configure Windows Defender SmartScreen' is set to 'Enabled: Warn and prevent bypass' | EnableSmartScreen"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.75.2.1
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\ShellSmartScreenLevel:
    title: "18.10.75.2.1 | Ensure 'Configure Windows Defender SmartScreen' is set to 'Enabled: Warn and prevent bypass' | ShellSmartScreenLevel"
    exists: true
    value: "Block"
    type: REG_SZ
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.75.2.1
  {{ end }}
{{ end }}
