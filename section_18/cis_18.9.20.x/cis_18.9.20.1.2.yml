---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_9_20_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\DisableWebPnPDownload:
    title: "18.9.20.1.2 | Ensure 'Turn off downloading of print drivers over HTTP' is set to 'Enabled' | DisableWebPnPDownload"
