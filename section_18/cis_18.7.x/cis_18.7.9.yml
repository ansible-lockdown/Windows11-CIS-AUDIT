---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_7_9 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\CopyFilesPolicy:
    title: "18.7.9 | Ensure 'Manage processing of Queue-specific files' is set to 'Enabled: Limit Queue-specific files to Color profiles' | CopyFilesPolicy"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.7.9
  {{ end }}
{{ end }}
