  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\RestrictDriverInstallationToAdministrators:
    title: "18.7.8 | Ensure 'Limits print driver installation to Administrators' is set to 'Enabled' | RestrictDriverInstallationToAdministrators"
