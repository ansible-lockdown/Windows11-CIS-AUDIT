---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_9_5_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\HVCIMATRequired:
    title: "18.9.5.4 | Ensure 'Turn On Virtualization Based Security: Require UEFI Memory Attributes Table' is set to 'True (checked)' | HVCIMATRequired"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.9.5.4
  {{ end }}
{{ end }}
