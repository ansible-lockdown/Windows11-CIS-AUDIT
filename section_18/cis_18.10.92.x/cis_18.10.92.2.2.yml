---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_10_92_2_2 }}
    {{ if eq .Vars.win11cis_au_options 4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\ScheduledInstallDay:
    title: "18.10.92.2.2 | Ensure 'Configure Automatic Updates: Scheduled install day' is set to '0 - Every day' | ScheduledInstallDay"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.92.2.2
    {{ end }}
  {{ end }}
{{ end }}
