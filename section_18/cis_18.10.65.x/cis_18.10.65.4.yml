---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_10_65_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\DisableOSUpgrade:
    title: "18.10.65.4 | Ensure 'Turn off the offer to update to the latest version of Windows' is set to 'Enabled' | DisableOSUpgrade"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.10.65.4
  {{ end }}
{{ end }}
