---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_6_6 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireStrongKey:
    title: "2.3.6.6 | Ensure 'Domain member: Require strong (Windows 2000 or later) session key' is set to 'Enabled' | RequireStrongKey"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.6.6
  {{ end }}
{{ end }}
