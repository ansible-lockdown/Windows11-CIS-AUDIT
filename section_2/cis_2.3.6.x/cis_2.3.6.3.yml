---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_6_3 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SignSecureChannel:
    title: "2.3.6.3 | Ensure 'Domain member: Digitally sign secure channel data (when possible)' is set to 'Enabled' | SignSecureChannel"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.6.3
  {{ end }}
{{ end }}
