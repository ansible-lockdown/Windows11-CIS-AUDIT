---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_6_5 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge:
    title: "2.3.6.5 | Ensure 'Domain member: Maximum machine account password age' is set to '30 or fewer days, but not 0' | MaximumPasswordAge"
    exists: true
    value: {{ .Vars.win11cis_domain_member_maximum_password_age }}
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.6.5
  {{ end }}
{{ end }}
