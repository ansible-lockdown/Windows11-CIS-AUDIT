---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_1_3 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse:
    title: "2.3.1.3 | Ensure 'Accounts: Limit local account use of blank passwords to console logon only' is set to 'Enabled' | LimitBlankPasswordUse"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.1.3
  {{ end }}
{{ end }}
