---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_8_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Lanmanworkstation\Parameters\EnableSecuritySignature:
    title: "2.3.8.2 | Ensure 'Microsoft network client: Digitally sign communications (if server agrees)' is set to 'Enabled' | EnableSecuritySignature"
