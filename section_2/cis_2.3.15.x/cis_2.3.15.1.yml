---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_15_1 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel\ObCaseInsensitive:
    title: "2.3.15.1 | Ensure 'System objects: Require case insensitivity for non-Windows subsystems' is set to 'Enabled' | ObCaseInsensitive"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.15.1
  {{ end }}
{{ end }}
