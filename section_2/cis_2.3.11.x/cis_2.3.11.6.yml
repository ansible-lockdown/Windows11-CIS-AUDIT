---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_11_6 }}
file:
  win11cis_2_3_11_6_forcelogoffwhenhourexpire:
    title: "2.3.11.6 | Ensure 'Network security: Force logoff when logon hours expire' is set to 'Enabled' | ForceLogoffWhenHourExpire"
    path: '{{ .Vars.win11cis_snapshot_dir }}\SystemAccess.ForceLogoffWhenHourExpire'
    exists: true
    contents:
      - '/^1$/'
    skip: {{ if not .Vars.win11cis_domain_joined }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "domain scoped - on a domain joined host the Default Domain Policy sets this [System Access] value, so the role does not apply it"
      workstation: 1
      CIS_ID:
        - 2.3.11.6
  {{ end }}
{{ end }}
