---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_9_1 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\AutoDisconnect:
    title: "2.3.9.1 | Ensure 'Microsoft network server: Amount of idle time required before suspending session' is set to '15 or fewer minute(s)' | AutoDisconnect"
    exists: true
    value: {{ .Vars.win11cis_smb_auto_disconnect_time }}
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.9.1
  {{ end }}
{{ end }}
