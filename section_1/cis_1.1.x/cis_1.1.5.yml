---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_1_5 }}
file:
  win11cis_1_1_5_passwordcomplexity:
    title: "1.1.5 | Ensure 'Password must meet complexity requirements' is set to 'Enabled' | PasswordComplexity"
    path: '{{ .Vars.win11cis_snapshot_dir }}\SystemAccess.PasswordComplexity'
    exists: true
    contents:
      - '/^1$/'
    skip: {{ if not .Vars.win11cis_domain_joined }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "domain scoped - on a domain joined host the Default Domain Policy sets this [System Access] value, so the role does not apply it"
      workstation: 1
      CIS_ID:
        - 1.1.5
  {{ end }}
{{ end }}
