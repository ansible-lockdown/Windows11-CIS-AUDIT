---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_1_7 }}
file:
  win11cis_1_1_7_cleartextpassword:
    title: "1.1.7 | Ensure 'Store passwords using reversible encryption' is set to 'Disabled' | ClearTextPassword"
    path: '{{ .Vars.win11cis_snapshot_dir }}\SystemAccess.ClearTextPassword'
    exists: true
    contents:
      - '/^0$/'
    skip: {{ if not .Vars.win11cis_domain_joined }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "domain scoped - on a domain joined host the Default Domain Policy sets this [System Access] value, so the role does not apply it"
      workstation: 1
      CIS_ID:
        - 1.1.7
  {{ end }}
{{ end }}
