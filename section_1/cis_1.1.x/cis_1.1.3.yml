---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_1_3 }}
command:
  win11cis_1_1_3_minimumpasswordage:
    title: "1.1.3 | Ensure 'Minimum password age' is set to '1 or more day(s)' | MinimumPasswordAge"
    exec: |-
      powershell -NoProfile -NonInteractive -Command "$p = Join-Path '{{ .Vars.win11cis_snapshot_dir }}' 'SystemAccess.MinimumPasswordAge'; if (-not (Test-Path -LiteralPath $p)) { 'NONCOMPLIANT not_collected' } else { $r = (Get-Content -LiteralPath $p -Raw).Trim(); if ($r -notmatch '^[0-9]+$') { 'NONCOMPLIANT actual=' + $r } else { $v = [int]$r; if ($v -ge {{ .Vars.win11cis_minimum_password_age }}) { 'COMPLIANT' } else { 'NONCOMPLIANT actual=' + $v } } }"
    exit-status: 0
    stdout:
      - '/^COMPLIANT$/'
    stderr:
      have-len: 0
    timeout: {{ .Vars.timeout_ms }}
    meta:
      workstation: 1
      CIS_ID:
        - 1.1.3
  {{ end }}
{{ end }}
