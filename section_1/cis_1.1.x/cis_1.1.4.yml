---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_1_4 }}
command:
  win11cis_1_1_4_minimumpasswordlength:
    title: "1.1.4 | Ensure 'Minimum password length' is set to '14 or more character(s)' | MinimumPasswordLength"
    exec: |-
      powershell -NoProfile -NonInteractive -Command "$p = Join-Path '{{ .Vars.win11cis_snapshot_dir }}' 'SystemAccess.MinimumPasswordLength'; if (-not (Test-Path -LiteralPath $p)) { 'NONCOMPLIANT not_collected' } else { $r = (Get-Content -LiteralPath $p -Raw).Trim(); if ($r -notmatch '^[0-9]+$') { 'NONCOMPLIANT actual=' + $r } else { $v = [int]$r; if ($v -ge {{ .Vars.win11cis_minimum_password_length }}) { 'COMPLIANT' } else { 'NONCOMPLIANT actual=' + $v } } }"
    exit-status: 0
    stdout:
      - '/^COMPLIANT$/'
    stderr:
      have-len: 0
    timeout: {{ .Vars.timeout_ms }}
    meta:
      workstation: 1
      CIS_ID:
        - 1.1.4
  {{ end }}
{{ end }}
