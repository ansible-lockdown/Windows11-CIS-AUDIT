---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_1_2 }}
    {{ if not .Vars.win11cis_domain_joined }}
command:
  win11cis_1_1_2_maximumpasswordage:
    title: "1.1.2 | Ensure 'Maximum password age' is set to '365 or fewer days, but not 0' | MaximumPasswordAge"
    exec: |-
      powershell -NoProfile -NonInteractive -Command "$p = Join-Path '{{ .Vars.win11cis_snapshot_dir }}' 'SystemAccess.MaximumPasswordAge'; if (-not (Test-Path -LiteralPath $p)) { 'NONCOMPLIANT not_collected' } else { $r = (Get-Content -LiteralPath $p -Raw).Trim(); if ($r -notmatch '^[0-9]+$') { 'NONCOMPLIANT actual=' + $r } else { $v = [int]$r; if ($v -le {{ .Vars.win11cis_maximum_password_age }} -and $v -ne 0) { 'COMPLIANT' } else { 'NONCOMPLIANT actual=' + $v } } }"
    exit-status: 0
    stdout:
      - '/^COMPLIANT$/'
    stderr:
      have-len: 0
    timeout: {{ .Vars.timeout_ms }}
    meta:
      workstation: 1
      CIS_ID:
        - 1.1.2
    {{ end }}
  {{ end }}
{{ end }}
