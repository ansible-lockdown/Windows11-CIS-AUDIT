---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_1_2_2 }}
file:
  win11cis_1_2_2_lockoutbadcount:
    title: "1.2.2 | Ensure 'Account lockout threshold' is set to '5 or fewer invalid logon attempt(s), but not 0' | LockoutBadCount"
    path: '{{ .Vars.win11cis_snapshot_dir }}\SystemAccess.LockoutBadCount'
    exists: true
    contents:
      - '/^[1-{{ .Vars.win11cis_bad_login_lockout_count }}]$/'
    meta:
      workstation: 1
      CIS_ID:
        - 1.2.2
  {{ end }}
{{ end }}
